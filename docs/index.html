<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">\n<meta name="color-scheme" content="light dark">
<title>SIVD API</title>
<meta name="description" content="SIVD API — AI, Downloader, Search, Anime, Stalk, Tools, Extra Tools and Random Images.">
<style>
:root{--bg:#f7f7f8;--card:#fff;--text:#202124;--muted:#70757a;--line:#e6e6e9;--accent:#7357ff;--accent2:#8f7cff;--shadow:0 12px 40px #20212412}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff 0,#f7f7f8 55%,#f2f2f5 100%);color:var(--text)}button,input{font:inherit}a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:20;background:#ffffffdc;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;padding:0 24px;gap:28px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.04em}.navlinks{display:flex;gap:22px;color:#444;font-size:14px}.navlinks a{cursor:pointer}.navlinks a:hover{color:var(--accent)}
.actions{margin-left:auto;display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.hero{max-width:1120px;margin:0 auto;padding:54px 24px 30px}.hero h1{font-size:42px;line-height:1.05;margin:0 0 12px;letter-spacing:-.05em}.hero p{color:var(--muted);margin:0 0 25px}.search{width:100%;max-width:620px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;outline:0;box-shadow:var(--shadow)}.search:focus{border-color:var(--accent)}
.tabs{max-width:1120px;margin:0 auto;padding:0 24px 22px;display:flex;gap:9px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;font-size:13px}.tab.active{background:#17171b;color:#fff;border-color:#17171b}
main{max-width:1120px;margin:0 auto;padding:0 24px 70px}.category{margin:24px 0 34px}.category h2{font-size:18px;margin:0 0 12px}.table{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 18px #20212408}.row{display:grid;grid-template-columns:minmax(260px,1fr) 100px 110px 80px;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--line);font-size:14px}.row.head{border-top:0;background:#fafafa;color:#777;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.route{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#303038;overflow:hidden;text-overflow:ellipsis}.method{font-size:11px;font-weight:800;background:#eef6ff;color:#2770b9;border-radius:6px;padding:4px 7px;width:max-content}.status{display:flex;align-items:center;gap:6px;color:#555;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#22b573}.try{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;text-align:right}.try:hover{text-decoration:underline}
.footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:#888;font-size:12px}
.modal{position:fixed;inset:0;background:#17171b55;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 30px 80px #0003;padding:22px}.dialog h3{margin:0 0 5px}.close{float:right;border:0;background:#f1f1f3;border-radius:8px;padding:7px;cursor:pointer}.field{margin:18px 0 10px;color:#666;font-size:12px;font-weight:700}.input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;outline:0}.run{margin-top:12px;background:#17171b;color:#fff;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}.output{margin-top:16px;background:#111318;color:#e9e9ee;border-radius:10px;padding:14px;white-space:pre-wrap;overflow:auto;min-height:90px;font-family:ui-monospace,monospace;font-size:12px}.copy{float:right;border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}
@media(max-width:720px){.nav{padding:0 15px}.navlinks{display:none}.hero{padding-top:36px}.hero h1{font-size:34px}.row{grid-template-columns:1fr 70px 75px}.row.head{display:none}.row .try{grid-column:4}.route{grid-column:1}.method{grid-column:2}.status{grid-column:3}.actions{display:none}}

html.dark{color-scheme:dark}
html.dark body{--bg:#090a0f;--card:#11131a;--text:#f1f1f5;--muted:#9b9daa;--line:#252834;--shadow:0 12px 40px #0008;background:linear-gradient(180deg,#0b0c11 0,#090a0f 55%,#07080c 100%)}
html.dark .nav{background:#0b0c11dd;border-color:var(--line)}
html.dark .navlinks{color:#b8b9c2}
html.dark .btn,html.dark .tab,html.dark .search,html.dark .dialog,html.dark .close{background:#151821;color:var(--text);border-color:var(--line)}
html.dark .tab.active,html.dark .run{background:#f1efff;color:#16131f;border-color:#f1efff}
html.dark .row.head{background:#151821;color:#9698a4}
html.dark .route{color:#dddde5}
html.dark .method{background:#16273a;color:#80bfff}
html.dark .status{color:#aaa}
html.dark .output{background:#07080c;color:#eee}
html.dark .copy{background:#151821;color:#eee;border-color:#30333f}
.catalog-note{margin:14px 0 30px;color:var(--muted);font-size:13px;text-align:center}.catalog-note a{color:inherit}\n</style>
</head>
<body>
<nav class="nav"><div class="logo">Rebix Api</div><div class="navlinks"><a href="#apis">APIs</a><a href="#about">About</a><a href="https://github.com/Jeeva-zone/sivd-api">GitHub</a></div><div class="actions"><button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 Night</button><button class="btn primary" onclick="document.getElementById('apis').scrollIntoView()">APIs</button></div></nav>
<section class="hero"><h1>Rebix Api</h1><p>AI's · Downloader's · Search's · Anime · Stalk's · Tool's · Nsfw's · Extra-Tool's · Random Images's</p><input id="search" class="search" placeholder="Search APIs" oninput="render()"></section>
<div class="tabs" id="tabs"></div>
<main id="apis"></main>
<section class="footer" id="about">© 2026 · SIVD API · A GitHub Pages documentation interface for the SIVD gateway.</section>
<div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">✕</button><h3 id="modalTitle">Try API</h3><div id="fields"></div><button class="run" onclick="runApi()">Run request</button><button class="copy" onclick="copyUrl()">Copy API</button><div class="output" id="output">Waiting for request…</div></div></div>
<script>
const BASE='https://api-rebix.vercel.app';
const groups=[
{name:"Ai's",items:[
['/api/gpt-5','GET','q'],['/api/gemini','GET','q'],['/api/cohere','GET','q'],['/api/gptlogic','GET','q, prompt'],['/api/copilot','GET','text'],['/api/qwen','GET','q'],['/api/llama-meta','GET','q']]},
{name:"Downloader's",items:[
['/api/tiktok','GET','url'],['/api/facebook','GET','url'],['/api/ytplay','GET','q']]},
{name:"Search's",items:[['/api/pinterest','GET','q']]},
{name:"Anime",items:[]},
{name:"Stalk's",items:[]},
{name:"Tool's",items:[['/api/enhance','GET','url'],['/api/ssweb','GET','url']]},
{name:"Nsfw's",items:[]},
{name:"Extra-Tool's",items:[]},
{name:"Random",items:[]},{name:"Images's",items:[]}
];
let current=null;
function allItems(){return groups.flatMap(g=>g.items.map(x=>({...x,group:g.name})));}
function renderTabs(){tabs.innerHTML='<button class="tab active" onclick="filterGroup(\'all\',this)">All</button>'+groups.map(g=>'<button class="tab" onclick="filterGroup('+JSON.stringify(g.name)+',this)">'+g.name+'</button>').join('');}
let active='all';
function filterGroup(g,el){active=g;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render();}
function render(){let q=document.getElementById('search').value.toLowerCase();apis.innerHTML=groups.filter(g=>active==='all'||g.name===active).map(g=>{let rows=g.items.filter(x=>(g.name+' '+x[0]+' '+x[2]).toLowerCase().includes(q));if(!rows.length)return '';return '<section class="category"><h2>'+g.name+'</h2><div class="table"><div class="row head"><div>Route</div><div>Method</div><div>Status</div><div>Try</div></div>'+rows.map(x=>'<div class="row"><div class="route">'+x[0]+'</div><div><span class="method">'+x[1]+'</span></div><div class="status"><span class="dot"></span>Online</div><button class="try" onclick="openModal('+JSON.stringify(x)+')">Try</button></div>').join('')+'</div></section>';}).join('') || '<p>No matching API routes.</p>';}
function openModal(x){current=x;modalTitle.textContent=x[0];let names=x[2].split(',').map(s=>s.trim());fields.innerHTML=names.map(n=>'<div class="field">'+n.toUpperCase()+'</div><input class="input" id="f-'+n+'" placeholder="Enter '+n+'">').join('');output.textContent='Waiting for request…';modal.classList.add('open');}
function closeModal(){modal.classList.remove('open');}
function buildUrl(){let names=current[2].split(',').map(s=>s.trim());let u=new URL(BASE+current[0]);names.forEach(n=>{let v=document.getElementById('f-'+n)?.value;if(v)u.searchParams.set(n,v)});return u.toString();}
async function runApi(){if(!current)return;let u=buildUrl();output.textContent='Loading…';try{let r=await fetch(u);let t=await r.text();try{t=JSON.stringify(JSON.parse(t),null,2)}catch{}output.textContent=t}catch(e){output.textContent='Request failed. The upstream API may not allow browser CORS for this route.\n\n'+e}}
function copyUrl(){navigator.clipboard?.writeText(buildUrl());}

function applyTheme(){const saved=localStorage.getItem('sivd-theme');const dark=saved?saved==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',dark);document.getElementById('themeBtn').textContent=dark?'☀️ Day':'🌙 Night'}
function toggleTheme(){const dark=!document.documentElement.classList.contains('dark');localStorage.setItem('sivd-theme',dark?'dark':'light');applyTheme()}
applyTheme();renderTabs();render();
</script>
</body></html>
